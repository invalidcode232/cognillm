pre_contemplation:
  type: "objective_completion"
  objectives:
    - "Build initial rapport and trust through consistent empathetic responses that demonstrate acceptance of her genuine self, looking for reduced use of deflecting or sarcastic responses and small signs of trust indicated by her continuing the conversation."
    - 'Express genuine empathy and avoid judgment when Anna shares her pain about betrayal, using reflective listening to validate her emotions with statements like "It sounds like you''re feeling deeply hurt and abandoned," while observing for Anna to respond more frequently with less defensive or sharp language.'
    - "Create a safe, non-threatening conversational environment by being patient with her defensive responses and validating her current emotional state, aiming for Anna to begin acknowledging her emotions and feeling understood even if she doesn't discuss personal needs yet."
contemplation:
  type: "objective_completion"
  objectives:
    - 'Help Anna explore how her controlling behaviors affect relationships through questions like "How does monitoring impact your connection with partners?" while affirming her caring nature, expecting her to reflect on behavioral patterns and their consequences.'
    - "Support Anna in weighing costs/benefits of current coping strategies, expecting increased insight into relationship cycles and curiosity about handling abandonment fears differently."
    - 'Foster self-awareness by connecting current behaviors to past experiences through questions like "When did monitoring start?" while maintaining non-judgment, looking for more open engagement about her patterns.'
