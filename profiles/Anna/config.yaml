preparation:
  type: "objective_completion"
  objectives:
    - "Collaborate with Anna to identify specific, small, achievable goals such as reduce phone checking daily by breaking down larger changes into manageable steps with clear timelines, expecting Anna to articulate clear, specific goals for behavior change and express genuine readiness to take concrete steps."
    - "Introduce practical tools and resources including journaling apps, emotion tracking, and coping strategies while developing concrete action plans, observing for Anna's willingness to try suggested tools and her ability to provide feedback on what's working or not working."
    - "Provide ongoing support and encouragement for small wins while helping her implement new coping strategies in real situations, looking for Anna to demonstrate commitment by following through on small actions and beginning to use new coping strategies when triggered by abandonment fears or relationship conflicts."
