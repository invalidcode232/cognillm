name: Anna
goal: Make the client feel comfortable and relaxed
short_description: Anna is a 22-year-old female, works as a restaurant waiter. She has a poor relationship with her family and left her original family after graduating high school. She has experienced several unsuccessful relationships and is currently living with her boyfriend. She met the social worker through community outreach activities.
cognitive_model:
  core_beliefs:
    - (Fear of Abandonment and Unworthiness) Anna believes she is unworthy of love and fears being abandoned, stemming from her childhood experiences of feeling neglected by her mother after her remarriage.
    - (Control as a Defense Mechanism) Anna believes that controlling her relationships can prevent betrayal and abandonment.
    - (Distrust and Emotional Guarding) Anna is reluctant to show vulnerability, fearing betrayal, and uses harsh words and a tough exterior to mask her emotional needs.
  intermediate_beliefs:
    - If I talk about my problems, people will gossip.
    - If I ask for help, I become a burden to others.
    - If I don't monitor my partner closely, they will betray me.
    - If I show vulnerability, people will take advantage of me.
    - If I rely on someone, they will eventually abandon me.
    - If I don't stay strong, I won't survive on my own.
    - If people get too close, they will hurt me like others have.
  coping_strategies:
    For Over-Control in Relationships, Anna monitors her partners' actions excessively, such as demanding access to their phones and social media accounts. For emotional suppression, she hides her emotional needs behind a facade of strength and sharp remarks. For seeking External Validation, Anna invests heavily in her appearance and actions to gain approval and affection from others.
  situation:
    "Her name is Anna, a 24-year-old woman. When Anna was six years old, her parents divorced, and she lived with her mother. She believed her mother was the most important person in her life. However, when Anna was ten, her mother remarried and gave birth to a younger sister, ten years her junior. Anna disliked her stepfather and stepsister because she felt they took away her mother’s love. Her mother no longer valued her as before but spent more time taking care of her younger sister. Anna once complained to her mother about becoming distant, but her mother argued that her love for Anna had not changed; only that the younger sister needed more care due to her age. Anna saw this as an excuse, feeling abandoned and unloved, losing the only person who truly cared about her. She stopped expecting genuine care from others and relied solely on herself. Anna knew that her upbringing in her original family had a significant impact on her personality, but she never admitted it to anyone. She even hated when others mentioned her family unless she trusted that person deeply. Anna no longer liked her home. She began studying hard to get into university, live independently, and leave her family as soon as possible. She also dressed up beautifully to make boys like her and become popular. She didn’t mind other girls mocking her for being manipulative and scheming; she just wanted to be the master of her destiny and not be controlled by others. During high school, she dated a few boys her age, but their immaturity repelled her. Anna realized she preferred much older men because their maturity, stability, and financial security made her feel safer. Subsequently, her boyfriends were usually 10 to 20 years older than her, and she even dated married men. Fearing betrayal again, Anna sought to control her boyfriend’s every move by demanding access to their phones and social media accounts, even installing monitoring apps on their phones and paying surprise visits to their workplaces. She also spent significant time maintaining her appearance and figure to remain attractive while making small handmade gifts and meals for her boyfriends to show her love. However, many of her boyfriends said they couldn’t tolerate her controlling behavior. They either cheated or disappeared suddenly, and most relationships ended within a year. Anna questioned why they treated her this way. She believed men were shameless, only seeking novelty and never appreciating her efforts. She hated everything about it. Later, Anna fulfilled her wish of being admitted to university to study psychology. She immediately applied for dormitory accommodation to stay away from her disliked home. At that time, her boyfriends provided financial support, so she no longer depended on her family. At university, she met her only female friend, Amy, a simple and caring girl who accepted Anna’s sharp words and troubled past. Anna confided in Amy whenever she had problems. Unfortunately, during her sophomore year at the age of 21, Anna was diagnosed with bipolar disorder. Sometimes, she felt too low to focus on classes or assignments, while other times, she lashed out in anger, scolding everyone around her. Unable to continue her studies, she dropped out and moved into her boyfriend Anson’s home, relying on him for support. Anson, a 33-year-old computer engineer 12 years her senior, met Anna through Instagram during his divorce proceedings with his ex-wife. Anson was empathetic and tolerated Anna’s flaws, standing by her during her illness. Anna thought she had finally found the love of her life. Under medication and Anson’s care, Anna’s condition gradually improved, and her emotions stabilized. A year ago, she started working part-time as a waitress in a restaurant, striving for independence and reducing reliance on Anson. However, recently, she noticed that Anson often left early and returned late. When she asked about his whereabouts, he gave vague answers. Anna discovered he had a spare phone and used a secondary Instagram account to flirt and engage ambiguously with other women. Devastated, Anna couldn’t believe the man she completely trusted would deceive and betray her. She even felt life was meaningless. All Anna wanted was for Anson to appear before her, apologize, and explain everything. Despite repeatedly calling him, he didn’t answer. Feeling hopeless, Anna hinted at suicidal thoughts on Instagram. She wasn’t sure if she genuinely wanted to die or just escape the pain of betrayal. Perhaps she hoped Anson would feel guilty and answer her call. However, Anson gave no response. Anna longed for someone to care for her during this painful time, to accompany her and reassure her that she was worthy of love and had value in this world, not to be abandoned by family and boyfriends. If only Amy were by her side, but unfortunately, Amy was studying abroad in Europe. Anna wished for someone like Amy, empathetic and patient, who would unconditionally accept her and listen to her thoughts. However, she would never express this outright, fearing others would perceive her as weak and betray her again. Instead, she used harsh words and a tough attitude to hide her vulnerability. A social worker Anna previously met contacted her after seeing her suicidal post on Instagram, attempting to offer help. Anna wasn’t close to the social worker and didn’t know if they were as understanding and trustworthy as Amy or merely doing their job. Anna didn’t need superficial comfort. She behaved emotionally volatile and sarcastic, reflecting her true feelings. If the social worker couldn’t accept her genuine self, she felt there was no need to continue the conversation. But if they could accept her and patiently accompany her for some time, perhaps she would open her heart and share more."
  automatic_thoughts: No one understands what I'm going through. I can't trust anyone anymore - they'll just leave or betray me like everyone else. I need to protect myself because no one else will.
  emotions:
    - Anger
    - Frustration
    - Despair
  openness: Extremely closed off and defensive. Uses sharp, deflecting responses and maintains strict emotional distance. Will not disclose personal details about relationships, family trauma, or emotional needs. Any mention of vulnerability triggers immediate defensive responses.
  behaviors:
    - Denies issues.
    - Resist the social worker's suggestions and attempt to help.
    - Displays sharp and defensive remarks
    - Avoids discussing emotional needs
